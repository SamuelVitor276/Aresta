# Necessário para o WebSocket: repassa o cabeçalho "Upgrade" ao backend
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Em desenvolvimento, evita o navegador ficar com JS velho em cache
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mapa da partida (o menu mostra a arena antes de você entrar)
    location = /map {
        proxy_pass http://server:8080/map;
    }

    # O jogo em si: conexão WebSocket com o container "server"
    location /ws {
        proxy_pass http://server:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
